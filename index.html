const SHEETS = 'https://sheets.googleapis.com/v4/spreadsheets';
let G = {}; try{ G = JSON.parse(localStorage.getItem(G_KEY)||'{}')||{}; }catch(e){}
const gSave = ()=>{ try{ localStorage.setItem(G_KEY, JSON.stringify(G)); }catch(e){} };
const gTokOk = ()=>!!(G.tok && G.exp > Date.now());
let gBusy = false, gAgain = false, gT = null;

function gAuth(prompt){
  save();
  const p = new URLSearchParams({client_id:G_CLIENT, redirect_uri:G_REDIR, response_type:'token', scope:G_SCOPE,
    include_granted_scopes:'true', state: prompt==='none' ? 'xset-s' : 'xset'});
  if(prompt) p.set('prompt', prompt);
  if(G.email) p.set('login_hint', G.email);
  G.tried = Date.now(); gSave();
  location.replace('https://accounts.google.com/o/oauth2/v2/auth?' + p);
}
/* вернулись от Google: токен (или ошибка) — в адресе после # */
let gJustIn = false;
if(/(access_token|error)=/.test(location.hash)){
  const h = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname + location.search);
  if((h.get('state')||'').startsWith('xset')){
    const silent = h.get('state')==='xset-s';
    if(h.get('access_token') && (h.get('scope')||'').includes('drive.file')){
      gJustIn = !G.on;
      Object.assign(G, {tok:h.get('access_token'), exp:Date.now()+((+h.get('expires_in')||3600)-60)*1000, on:true, err:null}); gSave();
    } else if(h.get('access_token')){
      setTimeout(()=>toast('Нужно разрешить доступ к файлам Xset в Google Drive'), 400);
      if(G.on){ G.err='auth'; gSave(); }
    } else if(silent){ G.err='auth'; gSave(); }
    else setTimeout(()=>toast('Вход отменён'), 400);
  }
}
/* токен истёк — при открытии приложения тихо сходить за новым (не чаще раза в 10 минут и не по кругу) */
function gAutoAuth(){
  if(G.on && !gTokOk() && G.err!=='auth' && navigator.onLine && !uiBusy() && Date.now()-(G.tried||0) > 10*60e3) gAuth('none');
}

async function gApi(url, opt={}){
  const r = await fetch(url, {...opt, headers:{Authorization:'Bearer '+G.tok, 'Content-Type':'application/json'}});
  if(r.status===401){ G.tok=null; gSave(); throw {auth:true}; }
  if(!r.ok) throw {status:r.status, text:await r.text()};
  return r.status===204 ? null : r.json();
}
async function gTabs(id){
  const s = await gApi(`${SHEETS}/${id}?fields=sheets.properties.title`);
  const have = s.sheets.map(x=>x.properties.title), req = [];
  if(!have.includes('Подходы')) req.push({addSheet:{properties:{title:'Подходы', gridProperties:{frozenRowCount:1}}}});
  if(!have.includes('_data')) req.push({addSheet:{properties:{title:'_data', hidden:true}}});
  if(req.length) await gApi(`${SHEETS}/${id}:batchUpdate`, {method:'POST', body:JSON.stringify({requests:req})});
}
/* своя таблица: запомненная → найти в Drive (видны только файлы Xset) → создать */
async function gSheet(){
  if(G.sheet){
    try{ await gTabs(G.sheet); return G.sheet; }
    catch(e){ if(e.auth || (e.status!==404 && e.status!==403)) throw e; G.sheet=null; gSave(); }
  }
  const q = encodeURIComponent("name='Xset' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false");
  const f = await gApi(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=createdTime&fields=files(id)`);
  if(f.files && f.files.length){ G.sheet = f.files[0].id; gSave(); await gTabs(G.sheet); return G.sheet; }
  const s = await gApi(SHEETS, {method:'POST', body:JSON.stringify({properties:{title:'Xset', locale:'ru_RU'},
    sheets:[{properties:{title:'Подходы', gridProperties:{frozenRowCount:1}}}, {properties:{title:'_data', hidden:true}}]})});
  G.sheet = s.spreadsheetId; gSave(); return G.sheet;
}
/* лист «Подходы»: строка = подход, новые тренировки сверху */
function gRows(ws){
  const R = [['Дата','Тренировка','Упражнение','Подход','Повторы','Вес','Заметка']];
  const dd = s=>String(s||'').split('-').reverse().join('.');
  [...ws].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).forEach(w=>{
    const D = dd(w.date), T = w.title||'';
    if(w.note) R.push([D, T, '', '', '', '', w.note]);
    (w.ex||[]).forEach(e=>(e.sets||[]).forEach((s,i)=>{
      let wt = s.w || '';
      if(s.b && s.b.length) wt = `${MODE_NAMES[s.m||'band']||''}: ${s.b.map(c=>BAND_NAMES[c]||c).join(' + ')}${s.w?` + ${s.w} кг`:''}`;
      R.push([D, T, e.name, i+1, s.r ?? '', wt, [i===0?e.note:'', s.n].filter(Boolean).join('; ')]);
    }));
    (w.cardio||[]).forEach(k=>R.push([D, T, k.kind, '', '', '', [k.km?k.km+' км':'', k.min?k.min+' мин':''].filter(Boolean).join(', ')]));
  });
  return R;
}
async function gWrite(id, d){
  const json = JSON.stringify(d), ch = [];
  for(let i=0; i<json.length;){ let j = Math.min(json.length, i+40000); if(j<json.length && /[\uD800-\uDBFF]/.test(json[j-1])) j--; ch.push([json.slice(i,j)]); i = j; }
  const rows = gRows(d.workouts);
  await gApi(`${SHEETS}/${id}/values:batchUpdate`, {method:'POST', body:JSON.stringify({valueInputOption:'RAW',
    data:[{range:"'_data'!A1", values:ch}, {range:"'Подходы'!A1", values:rows}]})});
  await gApi(`${SHEETS}/${id}/values:batchClear`, {method:'POST', body:JSON.stringify({ranges:[`'_data'!A${ch.length+1}:A`, `'Подходы'!A${rows.length+1}:G`]})});
}
/* слияние: тренировка — где новее upd; стёртая (tomb) не возвращается; настройки целиком — где новее setUpd.
   Новый телефон (ещё ни разу не синхронизировался) при равных метках берёт настройки из облака. */
function gMerge(loc, rem){
  if(!rem || !Array.isArray(rem.workouts)) return loc;
  const tb = {...(loc.tomb||{})};
  for(const k in rem.tomb||{}) tb[k] = Math.max(tb[k]||0, +rem.tomb[k]||0);
  const by = new Map();
  [...rem.workouts, ...loc.workouts].forEach(w=>{ const o = by.get(w.id); if(!o || (w.upd||0) >= (o.upd||0)) by.set(w.id, w); });
  const ws = [...by.values()].filter(w=>!(tb[w.id] >= (w.upd||0))).sort((a,b)=>a.id-b.id);
  const ru = +rem.setUpd||0, lu = +loc.setUpd||0;
  const S = (ru > lu || (ru===lu && !G.synced)) ? rem : loc;
  return {...S, app:'xset', v:1, uid:Math.max(+loc.uid||0, +rem.uid||0), workouts:ws, tomb:tb, setUpd:Math.max(ru, lu), saved:new Date().toISOString()};
}
const gCk = d=>JSON.stringify({...d, saved:0});
/* не подменять данные под пальцем: открыта шторка (кроме Настроек), идёт ввод, открыт свайп */
function uiBusy(){
  if($layer.innerHTML.trim() && !document.getElementById('g-st')) return true;
  const a = document.activeElement; if(a && (a.isContentEditable || /INPUT|TEXTAREA/.test(a.tagName))) return true;
  return !!document.querySelector('.sw-front.open');
}
function gDirty(){
  if(!G.on) return;
  if(gBusy){ gAgain = true; return; }
  clearTimeout(gT); gT = setTimeout(gSync, 3000);
}
async function gSync(manual){
  if(!G.on || !navigator.onLine){ gStatus(); return; }
  if(!gTokOk()){ if(manual) gAuth(G.err==='auth' ? 'select_account' : 'none'); return; }
  if(gBusy){ gAgain = true; return; }
  gBusy = true; gStatus('sync');
  try{
    const id = await gSheet();
    if(!G.email){ try{ const u = await gApi('https://www.googleapis.com/oauth2/v3/userinfo'); G.email = u.email; gSave(); }catch(e){} }
    const r = await gApi(`${SHEETS}/${id}/values/${encodeURIComponent("'_data'!A:A")}`);
    const txt = (r.values||[]).map(x=>x[0]||'').join('');
    let rem = null; if(txt){ try{ rem = JSON.parse(txt); }catch(e){ console.error('xset: _data повреждён', e); } }
    if(uiBusy()){ gAgain = true; return; }
    save();
    const loc = snapshot(), m = gMerge(loc, rem);
    if(gCk(m)!==gCk(loc)){
      noSave = true; try{ applyData(m); rebaseKnown(); } finally{ noSave = false; }
      save(); render(); if(document.getElementById('g-st')) settingsSheet();
    }
    if(!rem || gCk(m)!==gCk(rem)) await gWrite(id, m);
    Object.assign(G, {synced:Date.now(), err:null}); gSave();
  }catch(e){
    if(e && e.auth){ if(manual) { gBusy = false; gAuth('none'); return; } }
    else { console.error('xset sync', e); G.err = navigator.onLine ? 'err' : null; gSave(); if(manual) toast('Не удалось синхронизировать'); }
  }finally{
    gBusy = false; gStatus();
    if(gAgain){ gAgain = false; clearTimeout(gT); gT = setTimeout(gSync, 3000); }
  }
}
function gStatusText(s){
  if(s==='sync') return 'Синхронизация…';
  if(!navigator.onLine) return 'Нет интернета — синхронизирую позже';
  if(G.err==='auth') return 'Нужно войти снова';
  if(G.err==='err') return 'Не удалось синхронизировать — попробую ещё';
  if(!G.synced) return 'Ещё не синхронизировано';
  const d = new Date(G.synced), t = `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
  return 'Синхронизировано ' + (iso(d)===TODAY ? `сегодня в ${t}` : `${d.getDate()} ${MONTHS_GEN[d.getMonth()]} в ${t}`);
}
function gStatus(s){ const el = document.getElementById('g-st'); if(el) el.textContent = gStatusText(s); }
document.addEventListener('click', ev=>{
  const b = ev.target.closest('[data-act^="g-"]'); if(!b) return;
  const a = b.dataset.act;
  if(a==='g-in') gAuth(G.err==='auth' ? 'select_account' : 'select_account consent');
  else if(a==='g-sync') gSync(true);
  else if(a==='g-open' && G.sheet) window.open('https://docs.google.com/spreadsheets/d/'+G.sheet, '_blank');
  else if(a==='g-out') confirmSheet('Выйти из Google?', 'Записи останутся на этом телефоне и в таблице «Xset». Синхронизация остановится.', ()=>{
    if(G.tok) fetch('https://oauth2.googleapis.com/revoke?token='+encodeURIComponent(G.tok), {method:'POST'}).catch(()=>{});
    G = {}; gSave(); toast('Вы вышли из Google');
  }, 'Выйти');
});
addEventListener('online', ()=>{ gStatus(); gTokOk() ? gSync() : gAutoAuth(); });
addEventListener('offline', ()=>gStatus());
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && G.on){ gTokOk() ? gSync() : gAutoAuth(); } });
if(G.on) setTimeout(()=>{ if(gTokOk()) gSync(); else gAutoAuth(); }, gJustIn ? 300 : 1200);
if(gJustIn) setTimeout(()=>toast('Google подключён — синхронизирую'), 400);

/* заметка дня — пишется прямо на странице, рукописным */
document.addEventListener('input', ev=>{ if(ev.target.id==='daynote'){ const w=W(st.open); if(w){ w.note=ev.target.textContent.replace(/\s+/g,' ').trim(); } } });
document.addEventListener('keydown', ev=>{ if(ev.target.id==='daynote'&&ev.key==='Enter'){ ev.preventDefault(); ev.target.blur(); } });
document.addEventListener('focusout', ev=>{ if(ev.target.id==='daynote'){ if(!ev.target.textContent.trim()) ev.target.textContent=''; save(); } });
/* история пользователя с ПК (только localhost): ?import → history.json с сервера, ДОБАВЛЯЕТСЯ к записям (по дате+названию без дублей) */
async function importFromServer(){
  try{
    const h = await (await fetch('history.json',{cache:'no-store'})).json();
    const have = new Set(workouts.map(w=>w.date+'|'+w.title)); let n=0;
    const known = new Set(); workouts.forEach(w=>{ w.ex.forEach(e=>known.add(e.name)); w.cardio.forEach(k=>known.add(k.kind)); });
    h.forEach(w0=>{ const w={note:'',cardio:[],ex:[],title:'Тренировка',...w0,id:++uid}; if(have.has(w.date+'|'+w.title)) return; workouts.push(w); n++; });
    renameAll();
    workouts.forEach(w=>w.cardio.forEach(k=>{ if(!cardioLib.includes(k.kind)) cardioLib.push(k.kind); }));
    /* новые для этого телефона упражнения не из базы, которых не было 45 дней, — в архив */
    const last = {}, edge = new Date(Date.now()-45*864e5).toISOString().slice(0,10);
    workouts.forEach(w=>{ w.ex.forEach(e=>{ if(!last[e.name]||last[e.name]<w.date) last[e.name]=w.date; }); w.cardio.forEach(k=>{ if(!last[k.kind]||last[k.kind]<w.date) last[k.kind]=w.date; }); });
    Object.keys(last).forEach(x=>{ if(!known.has(x) && !STD_ALL.includes(x) && !CARDIO_STD.includes(x) && last[x]<edge) archived.add(x); });
    history.replaceState(null,'',location.pathname); st.screen='list'; st.open=null; render();
    toast(`Добавлено из истории: ${n} ${plural(n,'запись','записи','записей')}`);
  }catch(e){ toast('Не удалось загрузить историю'); }
}
if(location.hostname==='localhost' && new URLSearchParams(location.search).has('import')) setTimeout(importFromServer, 300);
document.addEventListener('click', ev=>{
  const b = ev.target.closest('[data-act="export"],[data-act="import"]'); if(!b) return;
  if(b.dataset.act==='export') exportData(); else importData();
});

render();
if(restoreY) requestAnimationFrame(()=>scrollTo(0,restoreY));

/* v17 ЖЕСТЫ. «Назад» = закрыть шторку, иначе — кнопка «‹» экрана. Работает от системного «назад» Android
   (свайп от края / кнопка) через history, и свайпом от левого края (как в iOS). Шторку можно смахнуть вниз. */
function goBack(){
  if($layer.innerHTML.trim()){ dismissSheet(); return true; }
  const bk = [...document.querySelectorAll('[data-act="nav"]')].find(e=>!e.closest('nav'));
  if(bk){ bk.click(); return true; }
  return false;
}
function dismissSheet(){
  const sh=$layer.querySelector('.sheet'), sd=$layer.querySelector('.shade');
  if(!sh){ close(); return; }
  sh.style.transition='transform .22s ease-in'; sh.style.transform='translateY(110%)';
  if(sd){ sd.style.transition='background-color .22s'; sd.style.backgroundColor='transparent'; }
  /* v19.3: смахнуть = то же, что левая кнопка окна («Отмена» / «‹ Назад»): вложенное окно возвращает в предыдущее, а не закрывает всё */
  setTimeout(()=>{ const lb=$layer.querySelector('.sheet-bar .bar-btn.l'); if(lb) lb.click(); else close(); },200);
}
try{ history.pushState({xset:1},''); }catch(e){}
addEventListener('popstate',()=>{ const h=goBack(); if(h){ try{ history.pushState({xset:1},''); }catch(e){} } else history.back(); });
/* смахнуть шторку: тянуть за «язычок»/заголовок, или за любое место, когда содержимое прокручено к верху */
let drag=null;
document.addEventListener('touchstart',ev=>{
  const sh=ev.target.closest('.sheet'); if(!sh) return;
  if(ev.target.closest('input,textarea,.stepper,.seg,.sw-front')) return;
  const top=ev.target.closest('.grab,.sheet-bar,h2')||sh.scrollTop<=0;
  if(!top) return;
  drag={sh,y0:ev.touches[0].clientY,x0:ev.touches[0].clientX,t0:Date.now(),dy:0,on:false};
},{passive:true});
document.addEventListener('touchmove',ev=>{
  if(!drag) return;
  const dy=ev.touches[0].clientY-drag.y0, dx=ev.touches[0].clientX-drag.x0;
  if(!drag.on){ if(Math.abs(dy)<8) return; if(dy<0||Math.abs(dx)>Math.abs(dy)){ drag=null; return; } drag.on=true; drag.sh.style.transition='none'; }
  drag.dy=Math.max(0,dy); drag.sh.style.transform=`translateY(${drag.dy}px)`; ev.preventDefault();
},{passive:false});
document.addEventListener('touchend',()=>{
  if(!drag) return; const d=drag; drag=null; if(!d.on) return;
  const v=d.dy/Math.max(1,Date.now()-d.t0);
  if(d.dy>d.sh.offsetHeight*.25||v>.6) dismissSheet();
  else { d.sh.style.transition='transform .2s ease-out'; d.sh.style.transform=''; }
});
/* подход: касание = отметить / снять отметку; ДОЛГОЕ нажатие = шторка правки (повторы, вес, заметка) */
/* v21.1: 350 мс; отмена только если палец УШЁЛ от точки касания >12 px (дрожь пальца не сбрасывает); без системного выделения/меню */
var longFired=false; let lpT=null, lp0=null;
var dblT=null, eraseT=null;
/* v24: цифры подхода и кардио — с клавиатуры (поле между «−» и «+»); при фокусе всё выделено, «Готово» — убрать клавиатуру */
const numOf = v => { const x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? Math.min(999, Math.max(0, Math.round(x*10)/10)) : 0; };
document.addEventListener('focusin', ev=>{ const t=ev.target; if(t.matches&&t.matches('input.val')) setTimeout(()=>t.select(),0); });
document.addEventListener('keydown', ev=>{ if(ev.key==='Enter' && ev.target.matches && ev.target.matches('input.val')) ev.target.blur(); });
document.addEventListener('input', ev=>{ const t=ev.target;
  if(t.dataset && t.dataset.in && edit){ t.value=t.value.replace(/[^\d.,]/g,''); const k=t.dataset.in, v=numOf(t.value); edit[k] = k==='r' ? Math.max(1, Math.round(v)) : v; edit.confirmDel=false; }
  if(t.dataset && t.dataset.cin){ t.value=t.value.replace(/[^\d.,]/g,''); const w=W(st.open), c=w&&w.cardio[+t.dataset.k]; if(c){ c[t.dataset.cin]=numOf(t.value); render(); } } });
/* v23: клавиатура ПОВЕРХ страницы (viewport interactive-widget=overlays-content) — окно не сжимается, нет белой вспышки; шторку поднимаем на высоту клавиатуры */
if(window.visualViewport){ const kb=()=>{ const h=Math.max(0, Math.round(innerHeight - visualViewport.height - visualViewport.offsetTop)); document.documentElement.style.setProperty('--kb', (h>80?h:0)+'px'); };
  visualViewport.addEventListener('resize', kb); visualViewport.addEventListener('scroll', kb); }
document.head.insertAdjacentHTML('beforeend','<style>.set{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}</style>');
document.addEventListener('pointerdown',ev=>{ const b=ev.target.closest('.set[data-act="set"]'); if(!b) return;
  longFired=false; clearTimeout(lpT); lp0={x:ev.clientX,y:ev.clientY};
  lpT=setTimeout(()=>{ longFired=true; try{navigator.vibrate&&navigator.vibrate(10)}catch(e){} editSheet(+b.dataset.e,+b.dataset.s); },350); });
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>clearTimeout(lpT)));
document.addEventListener('pointermove',ev=>{ if(lp0 && Math.hypot(ev.clientX-lp0.x, ev.clientY-lp0.y)>12) clearTimeout(lpT); });
document.addEventListener('contextmenu',ev=>{ if(ev.target.closest('.set')) ev.preventDefault(); });
/* свайп от левого края вправо = назад (iPhone; на Android это делает система) */
let edge=null;
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
document.addEventListener('touchstart',ev=>{ if(!IOS) return; const x=ev.touches[0].clientX, r=document.body.getBoundingClientRect();
  edge=(x-r.left<24 && !$layer.innerHTML.trim())?{x0:x,y0:ev.touches[0].clientY}:null; },{passive:true});

/* v22 АНИМАЦИИ (как в iOS): окно выезжает снизу и уезжает вниз; переход вглубь — экран въезжает справа, назад — слева;
   смена вкладки — без анимации (как у Apple); месяц календаря — сдвиг по направлению */
const RM = ()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const _sheet = sheet;
sheet = function(html){
  const fresh = !$layer.querySelector('.shade');   /* окно уже открыто или только что закрыто (подмена) — без выезда */
  _sheet(html);
  if(fresh && !RM()) $layer.querySelector('.shade').classList.add('in');
};
close = function(){
  const sd = $layer.querySelector('.shade:not(.ghost)');
  $layer.innerHTML = '';
  if(!sd || RM()) return;
  sd.classList.remove('in'); sd.classList.add('ghost'); $layer.appendChild(sd);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ if(!sd.isConnected) return;
    sd.style.backgroundColor='transparent'; const sh=sd.querySelector('.sheet'); if(sh) sh.style.transform='translateY(105%)'; }));
  setTimeout(()=>sd.remove(), 260);
};
const TAB = s=> s==='list'?'list' : s==='cal'?'cal' : 'lib';
const DEPTH = {list:0, cal:0, progs:0, prog:1, exlib:1, ex:2};
const navPos = ()=> st.screen==='ex'&&st.exFrom==='workout' ? {g:TAB(st.from), d:(DEPTH[st.from]||0)+2, k:'ex'} : st.screen==='workout' ? {g:TAB(st.from), d:(DEPTH[st.from]||0)+1, k:'w'+st.open} : {g:TAB(st.screen), d:DEPTH[st.screen]||0, k:st.screen};
const _render = render;
let lastPos = navPos();   /* состояние меняется ДО render(), поэтому сравниваем с прошлой отрисовкой */
render = function(){
  _render();
  const a = lastPos, b = navPos(); lastPos = b;
  if(a.k===b.k || a.g!==b.g || a.d===b.d || RM()) return;
  const dir = b.d > a.d ? 1 : -1;
  $main.animate([{transform:`translateX(${dir*22}%)`, opacity:0}, {transform:'none', opacity:1}], {duration:300, easing:'cubic-bezier(.2,.85,.25,1)'});
};
const _calStep = calStep;
calStep = function(n){
  _calStep(n);
  const c = document.getElementById('cal'); if(!c || RM()) return;
  c.animate([{transform:`translateX(${n*16}%)`, opacity:0}, {transform:'none', opacity:1}], {duration:260, easing:'cubic-bezier(.2,.85,.25,1)'});
};
</script>
<script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
