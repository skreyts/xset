/* Layout: одна колонка «тетрадный лист» в клетку, нижняя навигация, шторки снизу */
:root{
  --paper:#f6f7f2; --grid:#d3dcea; --ink:#3550c8; --ink-soft:rgba(53,80,200,.38); --ink-faint:rgba(53,80,200,.12);
  --muted:#6b7590; --danger:#b3261e; --sheet:#ffffff; --shade:rgba(20,25,40,.35);
  --band-r:#d8342c; --band-k:#1d1d1f; --band-p:#7b3fc4; --band-g:#2f9e44; --dot-ring:rgba(0,0,0,.25);
  --t-back:#d9480f; --t-chest:#2b8a3e; --t-legs:#7048e8; --t-box:#c2255c; --t-cardio:#0c8599; --t-mix:#e67700;
  --hl-s:rgba(255,214,10,.55); --hl-c:rgba(52,199,89,.38); --hl-b:rgba(255,45,85,.32); --hl-o:rgba(90,200,250,.45);
  --hand:"Marck Script","Segoe Print",cursive; --hand-w:400; --fsa:.38;
  /* на iPhone — системный SF (настоящий шрифт Apple), на Android/ПК — Inter (свободный, почти неотличим от SF) */
  --ui:-apple-system,"SF Pro Text","Inter","Roboto","Segoe UI",system-ui,sans-serif;
  --cell:22px;
}
:root[data-font="xset"]{--hand:"Xset Hand","Marck Script",cursive; --fsa:.54}
.oval{line-height:1.35!important}
.note,.month,.sum,.row .d small,.top,.progress,.ex-h .cnt,.prev,.setnotes,.legend,.btn,.fab,nav,.sheet .sub,.lbl,.chip,.choice span,.pick small,
.field label,.toast,.fontpick,.cal .wh,.cal .wk,.cal-legend,.cal-stats,.daycard .lines,.live,.lib-row small,.cal-head .arrows button{font-size-adjust:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#171b23; --grid:#262e3c; --ink:#a9c0ff; --ink-soft:rgba(169,192,255,.38); --ink-faint:rgba(169,192,255,.12);
  --muted:#8a93a8; --danger:#ff8a80; --sheet:#202633; --shade:rgba(0,0,0,.55);
  --band-r:#ff5a4f; --band-k:#0a0a0a; --band-p:#a77bf0; --band-g:#4cc764; --dot-ring:rgba(255,255,255,.6);
  --t-back:#ff8a50; --t-chest:#69db7c; --t-legs:#b197fc; --t-box:#f783ac; --t-cardio:#3bc9db; --t-mix:#ffc94d; --hl-s:rgba(255,214,10,.34); --hl-c:rgba(48,209,88,.34); --hl-b:rgba(255,55,95,.34); --hl-o:rgba(100,210,255,.32); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#171b23; --grid:#262e3c; --ink:#a9c0ff; --ink-soft:rgba(169,192,255,.38); --ink-faint:rgba(169,192,255,.12);
  --muted:#8a93a8; --danger:#ff8a80; --sheet:#202633; --shade:rgba(0,0,0,.55);
  --band-r:#ff5a4f; --band-k:#0a0a0a; --band-p:#a77bf0; --band-g:#4cc764; --dot-ring:rgba(255,255,255,.6);
  --t-back:#ff8a50; --t-chest:#69db7c; --t-legs:#b197fc; --t-box:#f783ac; --t-cardio:#3bc9db; --t-mix:#ffc94d; --hl-s:rgba(255,214,10,.34); --hl-c:rgba(48,209,88,.34); --hl-b:rgba(255,55,95,.34); --hl-o:rgba(100,210,255,.32); color-scheme:dark}

html,body{height:100%}
/* v15: рукописный — ТОЛЬКО запись тренировки (то, что пишется рукой); всё остальное — системный шрифт */
.head .d,.head .oval,.daynote,.ex .num,.ex-h .name,.set .r,.set .w,.cardio .val{font-family:var(--hand);font-weight:var(--hand-w)!important;font-style:var(--fst,normal);font-size-adjust:var(--fsa);color:var(--ink)}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:var(--cell) var(--cell);
  color:var(--label); font-family:var(--ui); font-size:17px;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.page{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 150px}

.note{font-family:var(--ui);font-size:13px;color:var(--muted);line-height:1.4;margin:0 0 10px}
h1{font-weight:700;font-size:38px;margin:0 0 4px;line-height:1}

/* список тренировок */
.month{font-family:var(--ui);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 2px}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 16px;padding:10px 0;border-bottom:1.5px solid var(--ink-soft)}
.row .d{font-weight:700;font-size:23px;line-height:1}
.row .d u{text-underline-offset:5px}
.row .d small{display:block;font-family:var(--ui);font-weight:400;font-size:13px;color:var(--muted);margin-top:6px}
.row .main{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.sum{font-family:var(--ui);font-size:13.5px;color:var(--muted);line-height:1.3}
.oval{display:inline-block;border:1.6px solid var(--ink);border-radius:999px;padding:3px 18px 4px;font-weight:700;font-size:22px;line-height:1.2;max-width:100%;overflow-wrap:anywhere}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none}
.icon-btn:active{background:var(--ink-faint)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.live{font-family:var(--ui);font-size:12px;color:var(--paper);background:var(--ink);border-radius:8px;padding:1px 6px;margin-left:6px}

/* страница тренировки */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--ui);font-size:15px;margin-bottom:6px}
.top button{color:var(--muted);padding:6px 0}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:4px 0}
.head .d{font-weight:700;font-size:28px;text-decoration:underline;text-underline-offset:6px}
.head .oval{font-size:26px}
.daynote{font-weight:500;font-size:22px;margin:2px 0 0}
.progress{font-family:var(--ui);font-size:15px;color:var(--muted);margin:6px 0 6px}
.progress b{color:var(--ink);font-weight:400}
.ex{padding:10px 0 4px}
.ex-h{display:flex;align-items:center;gap:10px}
.num{flex:none;width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:21px;line-height:1}
.ex-h .name{flex:1;font-weight:700;font-size:26px;line-height:1.05;min-width:0}
.ex-h .name em{font-style:normal;font-weight:500;font-size:20px;opacity:.75}
.ex-h .cnt{font-family:var(--ui);font-size:13px;color:var(--muted);white-space:nowrap}
.prev{font-family:var(--ui);font-size:13px;color:var(--muted);margin:3px 0 0 40px;line-height:1.35}
.sets{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px 4px;margin:4px 0 0 22px}
.set{position:relative;width:58px;height:58px;flex:none}
.set svg.x{position:absolute;left:14px;top:6px;width:30px;height:40px;overflow:visible}
.set path{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
.set .p1.plan{stroke:var(--ink-soft)}
.set .p2{stroke-dasharray:60;stroke-dashoffset:0}
.set .p2.draw{animation:draw .28s ease-out}
@keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
.set .r{position:absolute;left:40px;top:0;font-weight:700;font-size:22px;line-height:1;white-space:nowrap}
.set .r sup{font-size:15px;margin-left:1px}
.set .w{position:absolute;left:-4px;bottom:0;font-weight:500;font-size:16px;line-height:1;white-space:nowrap;display:flex;align-items:center;gap:2px}
.set.planned .r,.set.planned .w{color:var(--ink-soft)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1px var(--dot-ring)}
.dot.r{background:var(--band-r)} .dot.k{background:var(--band-k)} .dot.p{background:var(--band-p)} .dot.g{background:var(--band-g)}
.setnotes{font-family:var(--ui);font-size:13px;color:var(--muted);margin:2px 0 0 40px;line-height:1.35}
.add-set{width:40px;height:40px;margin:0 0 6px 6px;border:2px dashed var(--ink-soft);border-radius:50%;font-weight:700;font-size:26px;line-height:1;color:var(--ink-soft);text-align:center}
.cardio .val{font-weight:700;font-size:26px;margin-left:40px}
.add-ex{display:block;margin:14px 0 0;font-weight:700;font-size:25px;color:var(--ink);padding:6px 0}
.legend{font-family:var(--ui);font-size:13px;color:var(--muted);margin-top:18px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:3px}

/* библиотека */
.lib-add{display:flex;gap:8px;margin:8px 0 6px}
.lib-add input{flex:1;min-width:0}
input[type=text],input[type=date],input[type=search]{font-family:var(--hand);font-size:23px;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--ink);padding:4px 2px;border-radius:0;width:100%}
.lib-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1.5px solid var(--ink-soft)}
.lib-row .n{flex:1;font-weight:700;font-size:23px;min-width:0;line-height:1.1}
.lib-row small{font-family:var(--ui);font-size:13px;color:var(--muted);white-space:nowrap}

/* кнопки */
.btn{font-family:var(--ui);font-size:17px;border:2px solid var(--ink);border-radius:14px;padding:10px 16px;color:var(--ink);background:transparent;text-align:center}
.btn.fill{background:var(--ink);color:var(--paper)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger.fill{background:var(--danger);color:var(--paper)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:5;font-family:var(--ui);font-size:18px;background:var(--ink);color:var(--paper);border-radius:28px;padding:13px 26px;box-shadow:0 4px 14px var(--shade);white-space:nowrap}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:8px;background:var(--paper);border-top:1.5px solid var(--ink-soft);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav button{flex:1;max-width:240px;font-family:var(--ui);font-size:16px;color:var(--muted);padding:9px 0;border-radius:12px;text-align:center}
nav button.on{color:var(--ink);background:var(--ink-faint)}

/* шторка */
.shade{position:fixed;inset:0;z-index:20;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--sheet);border-radius:20px 20px 0 0;max-height:88%;overflow:auto;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-weight:700;font-size:28px;line-height:1.1}
.sheet .sub{font-family:var(--ui);font-size:14px;color:var(--muted);margin-top:-8px}
.sheet .acts{display:flex;gap:10px;flex-wrap:wrap}
.sheet .acts .btn{flex:1}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lbl{font-family:var(--ui);font-size:15px;color:var(--muted);width:76px;flex:none}
.stepper .val{flex:1;text-align:center;font-weight:700;font-size:40px;line-height:1}
.stepper button{width:54px;height:54px;border:2px solid var(--ink);border-radius:50%;font-family:var(--ui);font-size:28px;line-height:1;text-align:center;flex:none}
.bandrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--ui);font-size:15px;border:2px solid var(--ink-soft);border-radius:20px;padding:6px 11px}
.chip.on{border-color:var(--ink);background:var(--ink-faint)}
.chip .dot{width:12px;height:12px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:2px solid var(--ink-soft);border-radius:14px;padding:10px 14px;width:100%}
.choice b{font-weight:700;font-size:24px}
.choice span{font-family:var(--ui);font-size:13px;color:var(--muted)}
.pick{display:flex;flex-direction:column}
.pick button{font-weight:700;font-size:23px;padding:8px 0;border-bottom:1.5px solid var(--ink-soft);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pick button small{font-family:var(--ui);font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.field{display:flex;flex-direction:column;gap:2px}
.field label{font-family:var(--ui);font-size:13px;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:14px;
  background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 16px;font-family:var(--ui);font-size:15px;box-shadow:0 4px 14px var(--shade);white-space:nowrap}
.toast button{color:var(--paper);text-decoration:underline;font-family:var(--ui);font-size:15px}
/* выбор шрифта (только в макете) */
.fontpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;font-family:var(--ui);font-size:13px;color:var(--muted)}
.fontpick button{border:1.5px solid var(--ink-soft);border-radius:10px;padding:3px 10px;font-size:22px;line-height:1.2;color:var(--ink);font-size-adjust:none}
.fontpick button.on{border-color:var(--ink);background:var(--ink-faint)}

/* поиск */
.search{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--ink)}
.search svg{width:22px;height:22px;flex:none;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.search input{border-bottom:0!important}
.pick mark{background:var(--ink-faint);color:inherit;border-radius:3px}

/* календарь */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 8px}
.cal-title{font-weight:700;font-size:32px;line-height:1}
.cal-head .arrows{display:flex;gap:4px;align-items:center}
.cal-head .arrows button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--ui);font-size:22px;color:var(--ink);text-align:center}
.cal-head .arrows button:active{background:var(--ink-faint)}
.cal-head .today-btn{width:auto!important;border-radius:14px!important;padding:0 10px;font-size:14px!important;border:1.5px solid var(--ink-soft)}
.cal{display:grid;grid-template-columns:repeat(7,1fr) 28px;gap:2px 0;touch-action:pan-y}
.cal .wh{font-family:var(--ui);font-size:12px;color:var(--muted);text-align:center;padding-bottom:4px}
.cal .wh.we{color:var(--danger)}
.cal-cell{position:relative;height:48px;display:grid;place-items:center;border-radius:12px;text-align:center}
.cal-cell .n{position:relative;z-index:1;font-weight:700;font-size:23px;line-height:1}
.cal-cell.out .n{opacity:.28}
.cal-cell.sel{background:var(--ink-faint)}
.cal-cell.today .n{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.cal-cell svg{position:absolute;inset:3px 2px;width:calc(100% - 4px);height:calc(100% - 6px);overflow:visible}
.cal-cell svg path{fill:none;stroke-width:2.2;stroke-linecap:round}
.cal .wk{font-family:var(--ui);font-size:12px;color:var(--muted);display:grid;place-items:center}
.cal .wk b{font-weight:400;color:var(--ink);font-size:14px}
.cal{grid-template-columns:repeat(7,1fr) 34px!important}
.cal .wk{margin:3px 0 3px 10px;border-radius:11px;background:var(--fill)}
.cal .wk.has{background:var(--ink-faint)}
.wdots{display:flex;flex-direction:column;gap:4px;align-items:center}
.wdots i{display:block;width:6px;height:6px;border-radius:50%;background:var(--tint)}
.wdots.two{display:grid;grid-template-columns:6px 6px;gap:4px 3px;justify-content:center}
:root{--dot-s:#d4a500;--dot-c:#28a745;--dot-o:#32ade6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--dot-s:#ffd60a;--dot-c:#30d158;--dot-o:#64d2ff}}
:root[data-theme="dark"]{--dot-s:#ffd60a;--dot-c:#30d158;--dot-o:#64d2ff}
.wdots i.s{background:var(--dot-s)} .wdots i.c{background:var(--dot-c)} .wdots i.o{background:var(--dot-o)}
.cal .wh:last-of-type{padding-left:10px}
.cal-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--ui);font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.cal-legend i{width:12px;height:12px;border-radius:50%;border:2.2px solid;display:inline-block}
.cal-stats{font-family:var(--ui);font-size:14px;color:var(--muted);margin:2px 0 12px}
.cal-stats b{color:var(--ink);font-weight:400}
.daycard{border-top:1.5px solid var(--ink-soft);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.daycard .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.daycard .ttl{font-weight:700;font-size:24px;text-decoration:underline;text-underline-offset:5px}
.daycard .lines{font-family:var(--ui);font-size:14px;line-height:1.5}
.daycard .lines div{display:flex;gap:8px}
.daycard .lines div>span:last-child{min-width:0;overflow-wrap:anywhere}
.page,.cal,.daycard{min-width:0;max-width:100%}
body{overflow-x:hidden}
.daycard .lines .i{color:var(--muted);flex:none;width:16px;text-align:right}
.daycard .lines .s{color:var(--muted)}
.daycard .open{align-self:flex-start}
/* текстовыделитель: полоса за текстом, кончики скошены, как маркер */
.hlw{position:relative;display:inline-block;z-index:0}
.hl{position:absolute;z-index:-1;left:-4px;right:-4px;top:2px;bottom:0;border-radius:3px 6px 3px 6px;transform:skewX(-10deg)}
.cal-cell .hl{left:12%;right:12%;top:14%;bottom:14%}
.cal-cell .hl+.hl{top:50%}
.cal-legend i.sw{width:22px;height:10px;border:0;border-radius:2px 6px 2px 6px;transform:skewX(-14deg)}
.chip .sw{display:inline-block;width:22px;height:11px;border-radius:2px 6px 2px 6px;transform:skewX(-14deg)}

/* по Apple HIG: панель вкладок с иконками, «язычок» у шторки, цели нажатия ≥44 */
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px!important;padding:6px 0!important;min-height:44px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:none!important;color:var(--ink)}
.seg{display:flex;background:var(--ink-faint);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;text-align:center;padding:8px;border-radius:8px;font-family:var(--ui);font-size:15px;min-height:36px;font-size-adjust:none;color:var(--muted)}
.seg button.on{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px var(--shade)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ink-soft);align-self:center;margin:-8px 0 -4px;flex:none}
.top button,.chip,.btn{min-height:44px}
@media (prefers-reduced-motion:reduce){.set .p2.draw{animation:none}}

/* v9 — проход «как сделала бы Apple» */
:root{--tint:var(--ink); --sep:rgba(60,60,67,.18); --fill:rgba(118,118,128,.12); --group:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --group:#1f2430}}
:root[data-theme="dark"]{--sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --group:#1f2430}
:root[data-bg="plain"] body{background-image:none}
.titlebar{display:flex;align-items:center;justify-content:space-between;margin:6px 0 2px}
.icon-btn.tint{color:var(--tint)}
.icon-btn svg{width:22px;height:22px}
/* список: месяц — заголовок секции, тренировки — сгруппированный блок с тонкими разделителями */
.month{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 8px;letter-spacing:0;text-transform:none;font-family:var(--ui);font-size:20px;font-weight:600;color:var(--ink)}

.group>*{position:relative}
.row{border-bottom:0;padding:12px 14px 12px 14px;grid-template-columns:74px minmax(0,1fr);gap:4px 10px;cursor:pointer;-webkit-tap-highlight-color:transparent}

.row .oval{box-sizing:border-box}
.chev{color:var(--muted);opacity:.6;display:grid;place-items:center}
.chev svg,.back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.back svg{transform:scaleX(-1);width:12px;height:18px;margin-right:3px}
/* свайп-действия */
.sw-wrap{position:relative;overflow:hidden}
.sw-act{position:absolute;top:0;right:0;bottom:0;width:96px;display:grid;place-items:center;text-align:center;background:#ff3b30;color:#fff;font-family:var(--ui);font-size:15px;font-weight:500;font-size-adjust:none;visibility:hidden}

/* страница тренировки */
.top button{color:var(--tint);font-size:17px}
.back{display:inline-flex;align-items:center;margin-left:-4px}
.ex-h{width:100%;text-align:left}
.ex-h:active .name{opacity:.6}
.foot-acts{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin-top:28px}
.link-danger{font-family:var(--ui);font-size:17px;color:var(--danger);text-align:center;padding:12px;min-height:44px;font-size-adjust:none}
/* поиск — серое скруглённое поле, как в iOS */
.search{background:var(--fill);border:0;border-radius:10px;padding:0 10px;height:38px;margin:10px 0 2px}
.search svg{width:17px;height:17px;stroke:var(--muted)}
.search input{font-family:var(--ui)!important;font-size:17px!important;padding:0!important;height:38px;font-size-adjust:none}
.search input::placeholder{color:var(--muted)}

.switch.on{background:#34c759}

.fab{box-shadow:0 6px 20px var(--shade);font-weight:600;font-size:17px}
nav{background:color-mix(in srgb,var(--paper) 85%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--sep)}

.toast{border-radius:14px;font-weight:500}
.cal .wh.we{color:var(--muted);opacity:.7}
.cal-head .today-btn{border:0!important;background:var(--fill);color:var(--tint)!important;font-family:var(--ui);font-size:15px;border-radius:16px;padding:6px 12px;min-height:34px;font-size-adjust:none}
.cal-head .arrows{gap:2px}
.cal-head .arrows button{font-size:28px!important;color:var(--tint)!important;width:40px!important;height:44px!important}
.cal-head .cal-title{font-size:30px;min-width:0;text-align:center}
.daycard .open{border-width:1.5px}
.daycard .pl{opacity:.45}
/* верхняя строка: шестерёнка слева, «+» справа (как «Изменить / +» в iOS) */
.navrow{display:flex;justify-content:space-between;align-items:center;margin:0 -8px}

.navrow .icon-btn svg{width:23px;height:23px;stroke-width:1.6}
.titlebar{margin:0 0 4px;justify-content:flex-start!important;gap:14px}
.addbtn{width:44px;height:44px;border-radius:50%;background:var(--tint);display:grid;place-items:center;flex:none;box-shadow:0 2px 8px var(--shade)}
.addbtn svg{width:24px;height:24px;stroke:var(--paper);stroke-width:2.6;stroke-linecap:round;fill:none}
.addbtn:active{opacity:.7}
/* месяц прилипает к верху, пока листаешь его тренировки */
.month{position:sticky;top:0;z-index:3;background:var(--paper);padding:10px 4px 8px;margin:14px 0 0}

/* шторки iOS: серые круглые степперы, строки выбора — белые плашки, без рамок */
.bar-btn.l{justify-self:start;font-weight:400}
.bar-btn.plus{font-size:30px;line-height:1;font-weight:300}
.sheet-bar>span{display:block}
.sheet .choice{border:0!important;background:var(--group)!important;border-radius:12px;padding:12px 14px}
.sheet .choice b{font-size:22px}
.sheet .pick{background:var(--group);border-radius:12px;padding:0 14px}
.sheet .pick button{border-bottom:.5px solid var(--sep)}
.sheet .pick button:last-child{border-bottom:0}
.sheet .stepper button{border:0;background:var(--fill);color:var(--tint);width:50px;height:50px}
.sheet .stepper{background:var(--group);border-radius:12px;padding:8px 10px}
.sheet .field{background:var(--group);border-radius:12px;padding:8px 14px 10px}
.sheet .field input{border-bottom:0}
.sheet .btn{border:0;background:var(--group);color:var(--tint)}
.link-danger.sure{font-weight:600}
.sheet-bar h2{font-size-adjust:none;font-size:17px!important}
.search input:focus-visible{outline:none}
.sheet .field[style]{border:0!important}
/* подход: повторы правее и выше конца черты, чтобы X их не касался */
.set{width:64px;height:62px}
.add-set{margin-left:10px!important}
.set svg.x{left:22px;top:12px}
.set .r{left:55px;top:0}
.set .w{left:auto;right:calc(100% - 22px);bottom:-6px}
.sets{gap:4px 0;margin:10px 0 0 22px}
.sets{row-gap:16px}
.caprow{display:flex;justify-content:space-between;align-items:baseline}
.caprow button{font-family:var(--ui);font-size:15px;color:var(--tint);text-transform:none;letter-spacing:0;font-size-adjust:none}
.pd{display:flex;flex-direction:column;gap:2px;min-width:0}
.pd small{white-space:normal!important;font-size:13px!important}
.pick .nx{color:var(--tint)!important}
/* v13 — вкладка «Программы»: программы + вход в упражнения; карточка упражнения */
.prow{width:100%;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.prow:active,.lib-row[data-act]:active{background:var(--fill)}
.lib-row[data-act]{cursor:pointer}
.pm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pm small{white-space:normal!important;line-height:1.3}
.prow .n{line-height:1.25!important;padding-bottom:2px}
.prow{padding-top:10px!important;padding-bottom:10px!important}
.lib-row .chev{color:var(--muted);opacity:.6;display:grid;place-items:center;flex:none}
.badge{font-family:var(--ui);font-size:15px;color:var(--muted);white-space:nowrap;font-size-adjust:none}
.lib-row .n.ui{font-family:var(--ui);font-size:17px;font-weight:400!important;font-size-adjust:none}
.dayh{display:flex;align-items:center;gap:10px;margin:22px 4px 8px}
.dayh .name{font-size:26px;line-height:1.05}
.hist-d{font-family:var(--ui);font-size:15px;width:64px;flex:none;font-size-adjust:none}
.hist-t{font-family:var(--ui);font-size:15px;color:var(--ink);line-height:1.35;font-size-adjust:none}
.hist-t .dot{width:8px;height:8px}
.sec{font-family:var(--ui);font-size:20px;font-weight:600;margin:26px 4px 8px;font-size-adjust:none}
.page-h1{margin:6px 0 4px!important;line-height:1.1!important}

/* v15 — интерфейс системным шрифтом (как в iOS), синие «чернила» — только у записи от руки */
:root{--label:#1c1c1e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--label:#f2f2f7}}
:root[data-theme="dark"]{--label:#f2f2f7}
h1{font-size:34px!important;font-weight:700!important;letter-spacing:-.01em;line-height:1.1!important}
.page-h1{font-size:28px!important}
.month{color:var(--label)!important}
.row .d{font-size:17px!important;font-weight:600!important;font-variant-numeric:tabular-nums}
.row .oval,.daycard .oval{border:0!important;padding:0!important;border-radius:0!important;font-size:17px!important;font-weight:600!important;line-height:1.3!important}
.lib-row .n{font-size:17px!important;font-weight:400!important;line-height:1.3!important}
.prow .n{font-weight:500!important}
.dayh .name{font-size:20px!important;font-weight:600!important}
.dayh .num{width:26px;height:26px;font-size:14px;font-weight:600;border-width:1.5px}
.choice b,.sheet .choice b{font-size:17px!important;font-weight:600!important}
.pick button,.sheet .pick button{font-size:17px!important;font-weight:400!important;padding:12px 0!important;align-items:center!important}
.stepper .val{font-size:30px!important;font-weight:600!important;font-variant-numeric:tabular-nums}
input[type=text],input[type=date],input[type=search]{font-family:var(--ui)!important;font-size:17px!important;color:var(--label)!important}
.cal-title{font-size:22px!important;font-weight:600!important}
.cal-cell .n{font-size:17px!important;font-weight:500!important}
.daycard .ttl{font-size:17px!important;font-weight:600!important;text-decoration:none!important}
.daycard .note+*,.daycard .lines{color:var(--label)}
.hist-t{color:var(--label)!important}
.sheet h2{font-family:var(--ui)}
.sheet .num{width:24px!important;height:24px!important;font-size:13px!important;font-weight:600;border-width:1.5px}
.sheet .add-ex,.add-ex{font-family:var(--ui);font-size:17px!important;font-weight:400!important;color:var(--tint)!important}
.add-set{font-family:var(--ui);font-weight:300;font-size:24px;display:grid;place-items:center;padding:0;box-sizing:border-box}
.add-set svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;filter:none}
/* страница тренировки: упражнения отделены, крестики не липнут к названию и к следующему упражнению */
.ex{padding:16px 0 14px!important}
.ex+.ex{border-top:1.5px solid var(--ink-soft)}
.sets{margin-top:14px!important}
.ex-h .name{font-size:20px!important;line-height:1.15!important}
.ex .num{width:24px;height:24px;font-size:16px;border-width:1.6px}
.ex-h{gap:8px}
.head .d{color:var(--ink)}
.add-ex{margin-top:6px!important;border-top:1.5px solid var(--ink-soft);padding-top:14px!important}

.set .x{position:absolute;left:15px;top:6px;width:44px;height:46px}
.set .r{left:58px!important}
.set .w{bottom:-10px!important}
.set .x svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.set .x svg.plan{opacity:.42}
.xdefs{position:absolute;width:0;height:0;overflow:hidden}
.xdefs stop{stop-color:var(--ink);stop-opacity:1!important}.set .x svg path{opacity:.92}
.set .x svg.draw{animation:xdraw .3s ease-out}
@keyframes xdraw{from{clip-path:polygon(0 0,0 0,0 0)}to{clip-path:polygon(0 0,200% 0,0 200%)}}
@media (prefers-reduced-motion:reduce){.set .x svg.draw{animation:none}}
.head .oval{font-size:20px!important;padding:2px 14px 3px}
.set{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* «чернила шариковой ручки» на всём рукописном: зерно + чуть рваный край (фильтр #ink в xdefs) */
.head .d .dt{position:relative;filter:url(#ink)}
.head .oval,.daynote,.ex .num,.ex-h .name,.set .r,.set .w,.cardio .val,.set .x{filter:url(#ink)}
body,:root[data-bg="plain"] body,.month,.sheet{background-image:var(--grain);background-size:108px 108px}
/* v18: карандаш у «Записать», ластик у «Стереть» — линейные значки цветом текста, как SF Symbols */
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:none}
.add-ex,.link-danger,.btn.open{display:flex;align-items:center;justify-content:center;gap:7px}
.add-ex{justify-content:flex-start;width:100%}
.sw-act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px}
.sw-act svg.ic{width:24px;height:24px;stroke-width:1.8}
/* v19.2 */
svg.gl{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:none;display:block}
.stepper button,.cal-head .arrows button,.bar-btn.plus{display:grid!important;place-items:center;padding:0}
.cal-head .arrows button svg.gl{width:20px;height:20px;stroke-width:2.4}
.bar-btn.plus svg.gl{width:24px;height:24px;stroke-width:2}
/* v19.4: окно выбора упражнения — постоянной высоты (не прыгает от длины списка и от «Силовые | Кардио»); поля ввода без обводки, как в iOS — только курсор */
.sheet:has(#pick-q){height:88%}
.secrow{gap:12px}
.secrow .lead{width:30px;height:30px;border-radius:7px;background:var(--tint);display:grid;place-items:center;flex:none}
.secrow .lead svg{width:18px;height:18px;fill:none;stroke:var(--paper);stroke-width:2.2;stroke-linecap:round}
.secrow .lead svg circle{fill:var(--paper);stroke:none}
.secrow .cnt{font-family:var(--ui);font-size:17px;color:var(--muted);font-size-adjust:none}
input:focus,input:focus-visible,textarea:focus,textarea:focus-visible,select:focus,select:focus-visible{outline:none!important}
.bar-btn .back{display:inline-flex;align-items:center;margin-left:-4px}
details.arch summary::after{content:'';width:7px;height:7px;border:solid var(--muted);border-width:2px 2px 0 0;transform:rotate(45deg);margin-right:4px;padding:0}
details.arch[open] summary::after{transform:rotate(135deg)}
/* v22: карточка дня в календаре = мини-страница дневника (рукописная, как запись) */
.daycard .mhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-bottom:4px}
.daycard .mhead .d,.daycard .mhead .oval,.daycard .mnum,.daycard .mname,.daycard .msets,.daycard .daynote{font-family:var(--hand);font-weight:var(--hand-w)!important;font-size-adjust:var(--fsa);color:var(--ink);filter:url(#ink)}
.daycard .mhead .d{font-size:22px;font-weight:700}
.daycard .mhead .oval{border:1.6px solid var(--ink)!important;border-radius:999px!important;padding:1px 12px 2px!important;font-size:18px!important;line-height:1.3!important}
.daycard .mlines{display:flex;flex-direction:column;gap:10px;margin:4px 0 6px}
.daycard .mex{display:grid;grid-template-columns:24px 1fr;column-gap:10px;align-items:start}
.daycard .mnum{width:22px;height:22px;border:1.6px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:14px;line-height:1;margin-top:1px}
.daycard .mname{font-size:18px;line-height:1.25}
.daycard .msets{grid-column:2;font-size:17px;line-height:1.3;opacity:.72}
.daycard .msets .pl{opacity:.45}
.daycard .daynote{font-size:18px!important}
/* v22: анимации */
.set .x svg.erase{animation:xerase .26s ease-in forwards}
@keyframes xerase{from{clip-path:polygon(0 0,200% 0,0 200%);opacity:1}to{clip-path:polygon(0 0,0 0,0 0);opacity:.15}}
.shade.in{animation:shadein .28s ease-out}
.shade.in .sheet{animation:sheetin .32s cubic-bezier(.2,.85,.25,1)}
@keyframes shadein{from{background-color:transparent}}
@keyframes sheetin{from{transform:translateY(100%)}}
.shade.ghost{pointer-events:none;transition:background-color .24s ease-in}
.shade.ghost .sheet{transition:transform .24s ease-in}
.toast{animation:toastin .25s cubic-bezier(.2,.85,.25,1)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}}
/* v22: мелочи стиля. Точки недели = ТОТ ЖЕ цвет, что маркер даты (полупрозрачный маркер поверх бумаги), а не чистый жёлтый */
.wdots i.s{background:linear-gradient(var(--hl-s),var(--hl-s)),var(--paper)}
.wdots i.c{background:linear-gradient(var(--hl-c),var(--hl-c)),var(--paper)}
.wdots i.o{background:linear-gradient(var(--hl-o),var(--hl-o)),var(--paper)}
/* v22.1: светлая тема — бледно-жёлтая точка терялась на сером/голубоватом фоне капсулы. Капсула с тренировками = бумага
   (точка на ней = ровно маркер на бумаге) с тонкой обводкой; у точки — тонкий тёмный ободок, как у светлых образцов цвета в iOS */
.cal .wk.has{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--fill)}
.wdots i{box-shadow:0 0 0 .75px var(--dot-ring)}
:root{--dot-ring:rgba(0,0,0,.28)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--dot-ring:rgba(255,255,255,.3)}}
:root[data-theme="dark"]{--dot-ring:rgba(255,255,255,.3)}
.wdots i{width:7px;height:7px}
.wdots.two{grid-template-columns:7px 7px}
/* числа в итоге месяца — не синие «чернила» (это системный текст, синий читается как ссылка) */
.cal-stats b{color:var(--label);font-weight:600}
/* кнопки в карточке дня — как кнопка iOS с заливкой, без рамки (рамки-кнопки убраны везде в v10) */
.daycard .open{border:0!important;background:var(--fill);color:var(--tint);font-family:var(--ui);font-size:16px;font-weight:600;border-radius:12px;padding:10px 16px}
@media (prefers-reduced-motion:reduce){.set .x svg.erase,.shade.in,.shade.in .sheet,.toast{animation:none}}
/* v23 (отзыв после установки на телефон) */
/* фон за страницей — бумага (иначе при клавиатуре мелькает белое); «потянуть вниз» не перезагружает; текст не выделяется долгим нажатием */
html{background:var(--paper);overscroll-behavior-y:none}
body{overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
/* свайп: несколько кнопок рядом, как в «Почте» */
.sw-acts{position:absolute;top:0;right:0;bottom:0;display:flex;visibility:hidden}
.sw-wrap.act .sw-acts{visibility:visible}
.sw-acts .sw-act{position:static;width:84px;height:100%;visibility:inherit}
.sw-acts .sw-act:only-child{width:96px}
.sw-front{box-sizing:border-box}
/* тренировка: упражнение — строка со свайпом на бумаге */
.exw .sw-front{background-color:var(--paper);background-image:var(--grain);background-size:108px 108px}
.exw+.exw{border-top:1.5px solid var(--ink-soft)}
.exw .sw-act{font-size:13px}
/* овал названия — цветом типа тренировки */
.head .oval.k-s{border-color:var(--dot-s)} .head .oval.k-c{border-color:var(--dot-c)} .head .oval.k-o{border-color:var(--dot-o)}
.head .oval{border-width:2px}
/* заметка дня — пишется прямо на странице */
.daynote.ed{min-height:30px;outline:none;caret-color:var(--ink);margin:4px 0 0;padding:2px 0;cursor:text}
.daynote.ed:empty::before{content:attr(data-ph);color:var(--ink-soft)}
/* кубок рекорда — чернилами, с тем же зерном */
svg.cup{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:url(#ink);flex:none}
.set svg.cup{position:absolute;left:-2px;top:-6px}
.cardio .val svg.cup{vertical-align:-3px;margin-left:8px}
.msets svg.cup{width:17px;height:17px;vertical-align:-3px;margin-left:2px}
/* календарь: сегодня — обведено; выбран — заливка */
.cal-cell.today .n{text-decoration:none!important}
.cal-cell.today::after{content:'';position:absolute;left:50%;top:50%;width:36px;height:36px;transform:translate(-50%,-50%);border:1.8px solid var(--ink);border-radius:50%;pointer-events:none;filter:url(#ink)}
/* итог месяца — рукописный, как запись */
.msum{margin-top:16px;padding-top:12px;border-top:1.5px solid var(--ink-soft);display:flex;flex-direction:column;gap:8px;font-family:var(--hand);font-size-adjust:var(--fsa);color:var(--ink);filter:url(#ink)}
.msum b{font-weight:700}
.msum-l{font-size:22px}
.msum-k{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:20px}
.msum-h{font-size:22px;margin-top:8px;text-decoration:underline;text-underline-offset:5px}
.msum-r{display:flex;align-items:center;gap:8px;font-size:19px;line-height:1.25}
.msum svg.cup{filter:none}
/* маркер под датой (z-index:-1) не должен уходить под фон страницы */
.cal-cell,.hlw{isolation:isolate}
.daynote.ed:empty::before{opacity:.7}
/* v23: вес начинается под крестиком (не уходит за левый край); справа запас под «10»; снизу запас под вес/резинки, чтобы заметка не наезжала */
.set .w{left:8px!important;right:auto!important}
.sets{margin-right:26px!important;padding-bottom:14px}
.setnotes{margin-top:4px}
.set{touch-action:manipulation}
/* v23: «+» — круглая кнопка внизу по центру над вкладками (на всех трёх списках) */
#fab{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;width:58px;height:58px;border-radius:50%;background:var(--tint);display:grid;place-items:center;box-shadow:0 6px 18px var(--shade)}
#fab[hidden]{display:none}
#fab svg{width:26px;height:26px;stroke:var(--paper);stroke-width:2.6;stroke-linecap:round;fill:none}
#fab:active{opacity:.7}
#list-end{min-height:90px}
.page{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))!important}
/* v23: клавиатура не сжимает страницу (нет белой вспышки) — окно поднимается на её высоту */
.shade{bottom:var(--kb,0px)}
.pick .nx{color:var(--tint)}

.sheet-bar{grid-template-columns:minmax(max-content,1fr) minmax(0,auto) minmax(max-content,1fr)!important;column-gap:10px}
.sheet-bar h2{min-width:0;line-height:1.2}
/* v23: кубок над крестиком (раньше слева сверху — наезжал на повторы предыдущего подхода) */
.set svg.cup{left:27px!important;top:-9px!important;width:20px;height:20px}
:root{--cup:#e9b200;--cup-edge:#a87d00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--cup:#ffc93a;--cup-edge:transparent}}
:root[data-theme="dark"]{--cup:#ffc93a;--cup-edge:transparent}
svg.cup,.msum svg.cup,.msets svg.cup{filter:none!important;fill:var(--cup)!important;stroke:var(--cup-edge)!important;stroke-width:.6!important;stroke-linejoin:round}
/* v24: ПОДХОД — ширина по содержимому (сетка: крестик | повторы, под ними вес). Длинные повторы (120) или вес (112,5кг) раздвигают соседей, ничего не наезжает.
   Кубок — центр точно над точкой пересечения штрихов (22.7px от левого края крестика), вплотную к нему. */
.sets{display:flex;flex-wrap:wrap;align-items:flex-start;column-gap:14px!important;row-gap:12px!important;margin:12px 0 0 30px!important;padding-bottom:4px!important}
.set{display:grid!important;grid-template-columns:44px auto;grid-template-areas:"x r" "w w";width:auto!important;height:auto!important;min-width:0;padding:14px 0 0;position:relative;align-items:start;text-align:left}
.set .x{grid-area:x;position:relative!important;left:auto!important;top:auto!important;width:44px!important;height:46px!important}
.set .r{grid-area:r;position:static!important;left:auto!important;top:auto!important;margin:-6px 0 0 -2px;min-width:0}
.set .w{grid-area:w;position:static!important;left:auto!important;right:auto!important;bottom:auto!important;justify-self:start;margin:1px 0 0 -2px;min-height:16px}
.set svg.cup{left:16.3px!important;top:-3px!important} /* центр кубка (10px) = центр верхней V-ложбины X: середина между внутренними краями штрихов на высоте устья (y 30–45 из 153) ≈ 79.5 из 147 × 0.2993 = 23.8px (assets/x_vec.json). Перекрестие (74.4) визуально левее — пользователь отверг. */
.add-set{align-self:flex-start;margin:20px 0 0 0!important;width:36px!important;height:36px!important}
.sets{column-gap:10px!important;margin-left:18px!important;margin-right:0!important}
.cardio .val svg.cup{margin:0 8px 0 0!important;vertical-align:-2px}
.sheet .stepper input.val{font-size:24px!important;letter-spacing:-.3px}
.sheet .stepper{gap:6px!important}
.sheet .stepper .lbl{flex:none;width:76px}
/* 7–8 тренировок в неделю: 2 столбика по 4, точки чуть меньше, чтобы влезть в капсулу; больше 8 — числом */
.wdots.four{grid-template-columns:6px 6px!important;gap:3px 3px!important}
.wdots.four i{width:6px!important;height:6px!important}
input.val{width:100%;min-width:0;background:transparent;border:0;outline:none;padding:0;color:var(--label);text-align:center;font-family:var(--ui)}
input.val::placeholder{color:var(--muted)}
.set svg.cup path{fill:inherit!important;stroke:inherit!important;stroke-width:inherit!important;stroke-dasharray:none!important;animation:none!important}
</style>
</head>

  <button id="nav-list" data-act="nav" data-to="list"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Дневник</button>

<script>
const isoNow = ()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let TODAY = isoNow();
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const BAND_NAMES = {r:'красная',k:'чёрная',p:'фиолетовая',g:'зелёная'};
const MODE_NAMES = {band:'на резинке',assist:'в помощь',add:'утяжеление'};
let uid = 1000;

let workouts = [];

/* Стандартная база (у всех одинаковая) + «мои» поверх. Своё у каждого — в его Google-аккаунте. */
const STD = {
  'Грудь':['Жим штанги лёжа','Жим штанги на наклонной','Жим гантелей от груди','Жим гантелей на наклонной','Разводка гантелей','Сведение в кроссовере','Бабочка (тренажёр)','Отжимания','Брусья'],
  'Спина':['Подтягивания','Тяга верхнего блока','Тяга горизонтального блока','Тяга штанги в наклоне','Тяга гантели в наклоне','Становая тяга','Гиперэкстензия'],
  'Ноги':['Приседания со штангой','Жим ногами','Выпады','Болгарские выпады','Румынская тяга','Разгибание ног (тренажёр)','Сгибание ног (тренажёр)','Подъём на носки стоя','Ягодичный мост'],
  'Плечи':['Жим штанги стоя','Жим гантелей сидя','Махи гантелями в стороны','Задняя дельта в наклоне','Тяга к подбородку','Шраги'],
  'Руки':['Подъём штанги на бицепс','Подъём гантелей на бицепс','Молотки','Французский жим','Трицепс в блоке (канат)','Трицепс в блоке (прямая рукоять)'],
  'Пресс':['Скручивания','Подъём ног в висе','Планка']
};
const STD_ALL = Object.values(STD).flat();
let mineLib = [];               /* добавленные пользователем */
/* Архив: упражнения не из базы, которые давно не делали (площадка). История с ними остаётся. */
const archived = new Set();

const st = {screen:'list', open:null, from:'list', lastDrawn:null, libQuery:'', calMonth:TODAY.slice(0,7), calDay:null};
/* Маркер ставится сам: есть упражнения с подходами → силовая; только бег/скакалка/велосипед/бокс → кардио. Вручную — в «дата / название». */
const HL = {s:'Силовая',c:'Кардио',o:'Другое'};
function kindOf(w){
  if(w.hl) return w.hl;
  return w.ex.length ? 's' : 'c';
}
const hlSpan = (w,extra='')=>`<i class="hl" style="background:var(--hl-${kindOf(w)})${extra}"></i>`;
/* v19: тема — Авто (как в системе) | Светлая | Тёмная */
let theme = 'auto';
try{ const t=localStorage.getItem('wd-theme'); if(t==='light'||t==='dark') theme=t; }catch(e){}
function applyTheme(){ if(theme==='auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=theme; }
applyTheme();
const GROUPS = {back:'Спина',chest:'Грудь',mix:'Спина + грудь',legs:'Ноги',box:'Бокс',cardio:'Кардио'};
function groupOf(w){
  const t = w.title.toLowerCase();
  if(t.includes('спина')&&t.includes('грудь')) return 'mix';
  if(t.includes('спина')) return 'back';
  if(t.includes('грудь')) return 'chest';
  if(t.includes('ноги')) return 'legs';
  if(t.includes('бокс')) return 'box';
  if(w.cardio&&w.cardio.length&&!w.ex.length) return 'cardio';
  return 'mix';
}
/* поиск по частям слов: «триц рез» найдёт «Трицепс стоя на резинке» */
function matches(name, q){
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean), n = name.toLowerCase();
  return toks.every(t=>n.split(/[\s,()/-]+/).some(wd=>wd.startsWith(t)) || n.includes(t));
}
function hl(name, q){
  let out = esc(name);
  q.toLowerCase().split(/\s+/).filter(Boolean).forEach(t=>{
    const re = new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i');
    out = out.replace(re,'<mark>$1</mark>');
  });
  return out;
}
const SEARCH_ICON = '<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>';
const $main = document.getElementById('main'), $layer = document.getElementById('layer');
/* в рамке телефона прокручивается #main, а не окно */
const inFrame = ()=>false;
const winScroll = window.scrollTo.bind(window);
window.scrollTo = (x,y)=>{ if(inFrame()) $main.scrollTo(x,y); else winScroll(x,y); };
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = iso=>{const [y,m,d]=iso.split('-');return `${d}.${m}.${y.slice(2)}`};
const wd = iso=>WD[new Date(iso+'T12:00:00').getDay()];
const sorted = ()=>[...workouts].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
const W = id=>workouts.find(w=>w.id===id);
const kg = w=>String(w).replace('.',',');
const isDone = s=>s.done!==false;
const count = w=>{let t=0,d=0;w.ex.forEach(e=>e.sets.forEach(s=>{t++;if(isDone(s))d++}));return {t,d}};
const plural = (n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:(m>=2&&m<=4&&(h<12||h>14)?b:c)};
const GEAR = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
const ARCHIVE = '<svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="4" rx="1"/><path d="M5 8.5V19h14V8.5M10 12.5h4"/></svg>';
const PLUS = '<svg viewBox="0 0 24 24"><path d="M12 4.5v15M4.5 12h15"/></svg>';
const CHEV ='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
/* v19.2: значки в кнопках — только SVG (текстовые + − ‹ › сдвигаются из центра из-за отступов шрифта) */
const IC_PLUS ='<svg class="gl" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
const IC_MINUS='<svg class="gl" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>';
const IC_PREV ='<svg class="gl" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
const IC_NEXT ='<svg class="gl" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
const PENCIL='<svg class="ic" viewBox="0 0 24 24"><path d="M4.5 19.5l.9-4L15.6 5.3a2 2 0 0 1 2.8 0l.3.3a2 2 0 0 1 0 2.8L8.5 18.6z"/><path d="M13.6 7.3l3.1 3.1"/></svg>';
const ERASER='<svg class="ic" viewBox="0 0 24 24"><path d="M9 19.5l-4.6-4.6a1.6 1.6 0 0 1 0-2.3l8.3-8.3a1.6 1.6 0 0 1 2.3 0l5 5a1.6 1.6 0 0 1 0 2.3L12 19.5z"/><path d="M8.6 8.4l7 7M9 19.5h11"/></svg>';
const TRASH = '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const CROSS = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const dots = b=>b.map(c=>`<i class="dot ${c}"></i>`).join('');
const loadKey = s=>s.w?'w'+s.w:(s.b&&s.b.length?(s.m||'band')+s.b.join(''):'');
const loadHTML = s=>s.w?`${kg(s.w)}`:(s.b&&s.b.length?`${s.m==='assist'?'−':s.m==='add'?'+':''}${dots(s.b)}`:'');
/* кардио: все поля необязательны — пусто = просто название (с тренером цифр может не быть) */
const cardioText = c=>{
  if(c.rounds) return c.min?`${c.rounds} × ${c.min} мин`:`${c.rounds} ${plural(c.rounds,'раунд','раунда','раундов')}`;
  if(cmode(c.kind)==='r' && c.min) return `раунды по ${c.min} мин`;
  return [c.km?`${kg(c.km)} км`:'',c.min?`${c.min} мин`:''].filter(Boolean).join(' · ');
};
/* arch: false — только активные, true — только архив */
const allNames = (arch=false)=>{
  const last = {};
  sorted().forEach(w=>w.ex.forEach(e=>{ if(!(e.name in last)) last[e.name]=w.date; }));
  [...STD_ALL,...mineLib].forEach(n=>{ if(!(n in last)) last[n]=''; });
  return Object.keys(last).filter(n=>archived.has(n)===arch&&!hidden.has(n)).map(n=>({n,last:last[n],std:STD_ALL.includes(n),uses:workouts.filter(w=>w.ex.some(e=>e.name===n)).length}));
};
const cardioNames = (arch=false)=>cardioLib.filter(n=>archived.has(n)===arch&&!hidden.has(n)).map(n=>{
  const ws = sorted().filter(w=>w.cardio.some(k=>k.kind===n));
  return {n,last:ws[0]?ws[0].date:'',uses:ws.length,std:CARDIO_STD.includes(n)};
});
/* копия подходов как план; резинки копируются, только если включены в настройках */
/* вес наследуется: подход без веса = вес последнего подхода выше, где вес указан (как в тетради) */
const effSets = sets=>{ let cw=0; return sets.map(s=>{ if(s.w) cw=s.w; return (s.w||s.b&&s.b.length)?s:{...s,w:cw}; }); };
const planSets = sets=>effSets(sets).filter(isDone).map(s=>({r:s.r,w:s.w,done:false}));
/* удалённые из списков упражнения (записи с ними остаются) */
const hidden = new Set();
/* РЕКОРДЫ: лучший результат по упражнению ДО этой тренировки (раньше по дате; в тот же день — созданные раньше) */

/* календарь */
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const iso = d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
/* «от руки» обведённая дата: каждая обводка чуть другая */
function ring(seed, color, k){
  const r = (a)=>{const x=Math.sin(seed*12.9898+a*78.233)*43758.5453;return x-Math.floor(x)};
  const j = (a)=>((r(a)-.5)*6).toFixed(1);
  const s = k*5;
  return `<path stroke="${color}" d="M${30+ +j(1)} ${4+s} C ${52+ +j(2)} ${3+s}, ${57} ${40-s}, ${30+ +j(3)} ${41-s} C ${4+ +j(4)} ${42-s}, ${2} ${7+s}, ${34+ +j(5)} ${3+s+ +j(6)/2}" vector-effect="non-scaling-stroke"/>`;
}
function renderCal(){
  const [Y,M] = st.calMonth.split('-').map(Number);
  const first = new Date(Y,M-1,1), start = new Date(first); start.setDate(1-((first.getDay()+6)%7));
  const byDate = {}; workouts.forEach(w=>(byDate[w.date]=byDate[w.date]||[]).push(w));
  let cells = ['пн','вт','ср','чт','пт','сб','вс'].map((d,i)=>`<div class="wh ${i>4?'we':''}">${d}</div>`).join('')+'<div class="wh" title="тренировок за неделю">нед</div>';
  const d = new Date(start);
  for(let wk=0; wk<6; wk++){
    if(wk>0 && d.getMonth()!==M-1 && d>first) break;
    let n = 0; const ks = [];
    for(let i=0;i<7;i++){
      const k = iso(d), ws = byDate[k]||[], out = d.getMonth()!==M-1;
      n += ws.length; ws.forEach(w=>ks.push(kindOf(w)));
      cells += `<button class="cal-cell ${out?'out':''} ${k===st.calDay?'sel':''} ${k===TODAY?'today':''}" data-act="cal-day" data-d="${k}" aria-label="${d.getDate()} ${MONTHS_GEN[d.getMonth()]}${ws.length?': '+ws.map(w=>w.title).join(', '):''}">
        ${ws.slice(0,2).map(w=>hlSpan(w)).join('')}
        <span class="n">${d.getDate()}</span></button>`;
      d.setDate(d.getDate()+1);
    }
    /* итог недели — капсула с точками (1 точка = 1 тренировка), чтобы не путалась с датами */
    cells += `<div class="wk ${n?'has':''}" aria-label="${n} ${plural(n,'тренировка','тренировки','тренировок')} за неделю">${n?(n<=8?`<span class="wdots ${n>6?'two four':n>3?'two':''}">${ks.map(k=>`<i class="${k}"></i>`).join('')}</span>`:`<b>${n}</b>`):''}</div>`;
  }
  const inMonth = workouts.filter(w=>w.date.startsWith(st.calMonth));
  const cnt = {}; inMonth.forEach(w=>{const g=kindOf(w);cnt[g]=(cnt[g]||0)+1});
  const legend = Object.keys(HL).filter(g=>cnt[g]).map(g=>`<span><i class="sw" style="background:var(--hl-${g})"></i>${HL[g]} ${cnt[g]}</span>`).join('');
  /* v23: дата не выбрана → итог месяца (рукописный, как запись в дневнике); выбрана дата с тренировкой → её карточка */
  const sel = st.calDay ? (byDate[st.calDay]||[]) : [];
  let card = '';
  if(sel.length){
    const [sy,sm,sd] = st.calDay.split('-').map(Number);
    const dayLabel = `${sd} ${MONTHS_GEN[sm-1]}, ${wd(st.calDay)}`;
    card = sel.map(w=>{ const prs=w.ex.map(e=>prSet(e,w));
      return `<div class="daycard">
      <div class="mhead"><span class="d"><span class="hlw">${hlSpan(w)}<span class="dt">${dayLabel}</span></span></span><span class="oval">${esc(w.title)}</span></div>
      ${w.note?`<div class="daynote">${esc(w.note)}</div>`:''}
      <div class="mlines">${w.ex.map((e,i)=>`<div class="mex"><span class="mnum">${i+1}</span><span class="mname">${esc(e.name)}</span>${e.sets.length?`<span class="msets">${effSets(e.sets).map((s,j)=>(isDone(s)?setShort(s):`<span class="pl">${setShort(s)}</span>`)+(j===prs[i]?CUP:'')).join(', ')}</span>`:''}</div>`).join('')}
        ${w.cardio.map((k,i)=>{const t=cardioText(k); return `<div class="mex"><span class="mnum">${w.ex.length+i+1}</span><span class="mname">${esc(k.kind)}</span>${t?`<span class="msets">${t}${prCardio(k,w).length?CUP:''}</span>`:''}</div>`}).join('')}</div>
      <button class="btn open" data-act="open" data-id="${w.id}">Открыть тренировку</button></div>`; }).join('');
  } else if(inMonth.length){
    /* рекорды месяца: по упражнению — последний (самый высокий) */
    const prs = {}; [...inMonth].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id).forEach(w=>prList(w).forEach(r=>{ prs[r.n]=r.t; }));
    const nS = inMonth.reduce((a,w)=>a+count(w).d,0);
    card = `<div class="msum">
      <div class="msum-l"><b>${inMonth.length}</b> ${plural(inMonth.length,'тренировка','тренировки','тренировок')}${nS?`, <b>${nS}</b> ${plural(nS,'подход','подхода','подходов')}`:''}</div>
      <div class="msum-k">${Object.keys(HL).filter(g=>cnt[g]).map(g=>`<span><span class="hlw"><i class="hl" style="background:var(--hl-${g})"></i>${HL[g].toLowerCase()}</span> ${cnt[g]}</span>`).join('')}</div>
      ${Object.keys(prs).length?`<div class="msum-h">Рекорды</div>${Object.keys(prs).map(n=>`<div class="msum-r">${CUP}<span>${esc(n)} — ${prs[n]}</span></div>`).join('')}`:''}
    </div>`;
  } else card = '<p class="note" style="margin-top:14px">В этом месяце тренировок нет.</p>';
  $main.innerHTML = `<div class="cal-head"><span class="arrows"><button data-act="cal-step" data-d="-1" aria-label="Предыдущий месяц">${IC_PREV}</button><span class="cal-title">${MONTHS[M-1]}${Y!==+TODAY.slice(0,4)?' '+Y:''}</span><button data-act="cal-step" data-d="1" aria-label="Следующий месяц">${IC_NEXT}</button></span>
      ${st.calMonth!==TODAY.slice(0,7)?'<button class="today-btn" data-act="cal-today">Сегодня</button>':''}</div>
    <div class="cal" id="cal">${cells}</div>
    ${card}`;
}

  const [Y,M] = st.calMonth.split('-').map(Number), d = new Date(Y,M-1+n,1);

    <div class="as-btns"><button class="as-btn danger" data-act="yes">${label}</button><button class="as-btn strong" data-act="close">Отмена</button></div>`);

let undoFn = null;

function toast(text, btn){

  document.querySelectorAll('.toast').forEach(x=>x.remove());

  t.innerHTML = `<span>${text}</span>${btn||''}`;

/* Новая тренировка: типы по кругу. Сверху — тип, который дольше всего не делали (из тех, что в ходу последние 90 дней). */
function copyWorkout(src, date){
  return {id:nextId(),date,note:'',cardio:[],title:src?src.title:'Тренировка',

}

    {name:'Толкай',ex:['Жим штанги лёжа','Жим гантелей сидя','Махи гантелями в стороны','Трицепс в блоке (канат)']},

let activeProg = 'p1', progEdit = null, newDate = TODAY, progFromTab = false;
const P = id=>programs.find(p=>p.id===id);
function fromDay(day, date){
  const probe = {id:Infinity, date};
  return {id:nextId(),date,note:'',cardio:[],title:day.name,ex:day.ex.map(n=>{
    const p=prevFor(n,probe), pe=p&&p.ex.find(x=>x.name===n);
    return {name:n,sets:pe?planSets(pe.sets):[{r:10,w:0,done:false},{r:10,w:0,done:false},{r:10,w:0,done:false}]};
  })};
}
/* быстрые кнопки «без программы»: кардио, которое делал за последние 90 дней (до 3, свежие первыми) */
function recentCardio(date){
  const from = iso(new Date(new Date(date+'T12:00:00').getTime()-90*864e5)), out = [];
  sorted().forEach(w=>{ if(w.date<=date && w.date>=from) w.cardio.forEach(k=>{ if(!out.includes(k.kind)) out.push(k.kind); }); });
  return out.slice(0,3);
}

  const p = P(activeProg);
  const last = p && sorted().find(w=>w.date<=date && p.days.some(d=>d.name===w.title));
  const nextI = p && last ? (p.days.findIndex(d=>d.name===last.title)+1)%p.days.length : 0;
  sheet(`${bar('Записать тренировку', L('close'))}
    <div class="field"><label for="nw-date">Дата</label><input type="date" id="nw-date" value="${date}"></div>
    ${p?`<div class="cap">Программа тренировок</div>
    <div class="pick"><button data-act="prog-list"><span>${esc(p.name)}</span><small>Сменить ›</small></button></div>
    <div class="cap">День программы</div>
    <div class="pick">${p.days.map((d,i)=>`<button data-act="new-day" data-i="${i}"><span class="pd"><span>${esc(d.name)}</span><small>${d.ex.map(esc).join(', ')}</small></span><small class="nx">${i===nextI?'следующий':''}</small></button>`).join('')}</div>`

}

/* Кардио отдельно от силовых: переключатель как сегмент в iOS */
const CARDIO_STD = ['Бег','Велосипед','Ходьба','Лыжи','Гребля','Скакалка','Эллипс','Бокс: мешок','Бокс: лапы'];
let cardioLib = [...CARDIO_STD];
/* что записывать у кардио: m = минуты, mk = минуты и км, r = раунды × минуты */
const CMODE = {'Бег':'mk','Велосипед':'mk','Ходьба':'mk','Лыжи':'mk','Гребля':'mk','Скакалка':'m','Эллипс':'m','Бокс: мешок':'r','Бокс: лапы':'r'};
const cmode = n=>CMODE[n]||'m';
const CM_NAMES = {m:'Минуты',mk:'Км и мин',r:'Раунды'}, CM_SHORT = {m:'мин',mk:'км · мин',r:'раунды'};
const cmSeg = cur=>`<div class="field"><label>Записывать</label><div class="seg" style="margin:0">${Object.keys(CM_NAMES).map(k=>`<button class="${cur===k?'on':''}" data-act="cm-pick" data-m="${k}">${CM_NAMES[k]}</button>`).join('')}</div></div>`;
const segHTML = ()=>st.pickFor!=null?'':`<div class="seg" role="tablist"><button class="${st.pickTab!=='c'?'on':''}" data-act="pick-tab" data-t="s">Силовые</button><button class="${st.pickTab==='c'?'on':''}" data-act="pick-tab" data-t="c">Кардио</button></div>`;
function cardioPick(ql){
  const items = cardioLib.filter(n=>!archived.has(n)&&!hidden.has(n)&&(!ql||matches(n,ql)));
  sheet(`${bar(st.pickFor!=null?'Упражнение':'Добавить', L('pick-cancel'))}${segHTML()}
    <div class="search">${SEARCH_ICON}<input type="search" id="pick-q" placeholder="поиск…" value="${esc(ql)}" aria-label="Поиск" autocomplete="off"></div>
    <div class="pick">${items.map(n=>`<button data-act="pick-cardio" data-n="${esc(n)}"><span>${ql?hl(n,ql):esc(n)}</span><small>${CM_SHORT[cmode(n)]}</small></button>`).join('')}
    ${ql&&!cardioLib.some(n=>n.toLowerCase()===ql.toLowerCase())?`<button data-act="pick-cardio" data-n="${esc(ql)}">+ «${esc(ql)}» — новое кардио</button>`:''}</div>`);
}
function cardioSheet(k){
  const c = W(st.open).cardio[k];
  const m = cmode(c.kind);
  const step = (lbl,f,d)=>`<div class="stepper"><span class="lbl">${lbl}</span><button data-act="cst" data-k="${k}" data-f="${f}" data-d="-${d}" aria-label="Меньше">${IC_MINUS}</button><input class="val" data-cin="${f}" data-k="${k}" inputmode="${f==='km'?'decimal':'numeric'}" enterkeyhint="done" maxlength="5" value="${c[f]?kg(c[f]):''}" placeholder="—" aria-label="${lbl}"><button data-act="cst" data-k="${k}" data-f="${f}" data-d="${d}" aria-label="Больше">${IC_PLUS}</button></div>`;
  sheet(`${bar(esc(c.kind), '', R('close'))}
    ${m==='r' ? step('Раунды','rounds',1)+step('Раунд, мин','min',1) : (m==='mk'?step('Км','km',0.5):'')+step('Минуты','min',5)}
    <button class="link-danger" data-act="cardio-del" data-k="${k}">Удалить</button>`);
}
function pickSheet(q=''){
  const ql = q.trim();
  if(st.pickTab==='c' && st.pickFor==null) return cardioPick(ql);
  const all = allNames();
  const items = all.filter(x=>!ql||matches(x.n,ql)).sort((a,b)=>b.last.localeCompare(a.last)||a.n.localeCompare(b.n,'ru'));
  const exact = allNames(true).concat(all).some(x=>x.n.toLowerCase()===ql.toLowerCase());
  sheet(`${bar(st.pickFor!=null?'Упражнение':'Добавить', L('pick-cancel'))}${segHTML()}
    <div class="search">${SEARCH_ICON}<input type="search" id="pick-q" placeholder="начните вводить: «жим лёж»…" value="${esc(q)}" aria-label="Поиск упражнения" autocomplete="off"></div>
    <div class="pick" id="pick-list">${items.map(x=>`<button data-act="pick-ex" data-n="${esc(x.n)}"><span>${ql?hl(x.n,ql):esc(x.n)}</span><small>${x.last?fmt(x.last):'новое'}</small></button>`).join('')}
    ${ql&&!exact?`<button data-act="pick-new">+ «${esc(ql)}» — новое упражнение</button>`:''}</div>`);
}

document.addEventListener('input', ev=>{
  /* v19.4: при вводе меняется только список, окно и поле остаются на месте (раньше перерисовывалось всё окно — скакало) */
  if(ev.target.id==='pick-q'){ let html=''; const keep=sheet; sheet=h=>{html=h}; try{ pickSheet(ev.target.value); } finally { sheet=keep; }
    const t=document.createElement('div'); t.innerHTML=html; const nw=t.querySelector('.pick'), cur=$layer.querySelector('.pick');
    if(nw&&cur){ cur.innerHTML=nw.innerHTML; cur.scrollTop=0; } }
  if(ev.target.id==='lib-new'){ st.libQuery=ev.target.value; const pos=ev.target.selectionStart; renderLib(); const i=document.getElementById('lib-new'); i.focus(); try{i.setSelectionRange(pos,pos)}catch(e){} }
});

/* полоска месяцев справа, как буквы в «Контактах»: ведёшь пальцем — список прыгает к месяцу */
let idxOn = false;
function idxGo(e){
  const el = document.elementFromPoint(e.clientX, e.clientY), b = el && el.closest('[data-m]');
  if(!b) return;
  const t = document.getElementById('m-'+b.dataset.m);
  if(!t) return;
  fitEnd();
  const f = inFrame(), sc = f ? $main : document.scrollingElement;
  /* самый свежий месяц — в самый верх, чтобы был виден заголовок «Тренировки»; остальные — заголовком месяца под верх */
  if(b === b.parentNode.firstElementChild){ sc.scrollTop = 0; return; }
  /* первая тренировка месяца — сразу под прилипшим заголовком месяца */
  const head = t.previousElementSibling, hh = head ? head.offsetHeight : 0;
  const top0 = f ? $main.getBoundingClientRect().top : 0;
  sc.scrollTop += t.getBoundingClientRect().top - top0 - hh;
}
document.addEventListener('pointerdown', e=>{ if(e.target.closest('.mindex')){ idxOn=true; idxGo(e); } });
document.addEventListener('pointermove', e=>{ if(idxOn) idxGo(e); });
document.addEventListener('pointerup', ()=>idxOn=false);
document.addEventListener('pointercancel', ()=>idxOn=false);

/* свайп влево по строке открывает действие (как в «Почте»/«Заметках») */
let sw = null, swEat = false;
const SW_W = 96;
function closeSwipes(except){ document.querySelectorAll('.sw-front.open').forEach(f=>{ if(f!==except){ f.classList.remove('open'); f.style.transform=''; setTimeout(()=>{ if(!f.classList.contains('open')) f.parentNode.classList.remove('act'); },260); } }); }
document.addEventListener('pointerdown', e=>{
  const f = e.target.closest('.sw-front'); if(!f) return;
  const aw = f.parentNode.querySelector('.sw-acts'), aW = aw ? aw.offsetWidth : SW_W;
  sw = {f, W:aW, x:e.clientX, y:e.clientY, dx:0, base:f.classList.contains('open')?-aW:0, moved:false};
  /* долгое нажатие на строку тренировки → подтверждение удаления (как контекстное меню iOS) */
  clearTimeout(lpTimer);
  if(f.dataset.act==='open') lpTimer = setTimeout(()=>{ if(sw&&!sw.moved){ sw=null; swEat=true; setTimeout(()=>swEat=false,400);
    const x=W(+f.dataset.id); if(x) confirmSheet(`${fmt(x.date)} · ${esc(x.title)}`, 'Запись будет стёрта из дневника.', ()=>{workouts=workouts.filter(o=>o!==x)}, 'Стереть запись'); } }, 550);
});
let lpTimer = null;
document.addEventListener('pointerup', ()=>clearTimeout(lpTimer));
document.addEventListener('contextmenu', e=>{ if(e.target.closest('.sw-front')) e.preventDefault(); });
document.addEventListener('pointermove', e=>{
  if(!sw) return;
  const dx = e.clientX-sw.x, dy = e.clientY-sw.y;
  if(!sw.moved){ if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){ sw=null; return; } if(Math.abs(dx)>8){ sw.moved=true; sw.f.style.transition='none'; sw.f.parentNode.classList.add('act'); closeSwipes(sw.f); } }
  if(sw.moved){ clearTimeout(lpTimer); sw.dx=dx; const t=Math.min(0,Math.max(-sw.W*1.25,sw.base+dx)); sw.f.style.transform=`translateX(${t}px)`; }
});
function swEnd(){
  if(!sw) return;
  if(sw.moved){ const open=(sw.base+sw.dx)<-Math.min(60,sw.W/2); sw.f.style.transition=''; sw.f.style.transform=open?`translateX(-${sw.W}px)`:''; sw.f.classList.toggle('open',open); if(!open){ const f=sw.f; setTimeout(()=>{ if(!f.classList.contains('open')) f.parentNode.classList.remove('act'); },260); } swEat=true; setTimeout(()=>swEat=false,50); }
  sw = null;
}
document.addEventListener('pointerup', swEnd);
document.addEventListener('pointercancel', swEnd);
/* на телефоне браузер забирал горизонтальный жест себе (pointercancel) — строка не раскрывалась. Горизонтальный жест по строке — наш */
let swT = null;
document.addEventListener('touchstart', e=>{ swT = e.target.closest('.sw-front') ? {x:e.touches[0].clientX, y:e.touches[0].clientY, h:null} : null; }, {passive:true});
document.addEventListener('touchmove', e=>{ if(!swT) return; const dx=e.touches[0].clientX-swT.x, dy=e.touches[0].clientY-swT.y;
  if(swT.h===null && (Math.abs(dx)>4||Math.abs(dy)>4)) swT.h = Math.abs(dx)>Math.abs(dy);
  if(swT.h) e.preventDefault(); }, {passive:false});

document.addEventListener('click', ev=>{
  if(swEat){ swEat=false; ev.preventDefault(); return; }
  const fr = ev.target.closest('.sw-front');
  if(document.querySelector('.sw-front.open') && !ev.target.closest('.sw-act')){ closeSwipes(); if(fr) return; }
  const b = ev.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a==='close-bg'){ if(ev.target===b) dismissSheet(); return; }
  const w = st.open && W(st.open);
  const ei = +b.dataset.e, si = +b.dataset.s;
  switch(a){
    case 'nav': st.screen=b.dataset.to; st.open=null; if(b.closest('nav')) st.calDay=null; close(); render(); scrollTo(0,0); break;
    case 'open': if(st.screen!=='workout') st.from=st.screen; st.screen='workout'; st.open=+b.dataset.id; render(); scrollTo(0,0); break;
    case 'cal-day': { const k=b.dataset.d; if(!workouts.some(o=>o.date===k)) break; st.calDay = st.calDay===k?null:k; if(k.slice(0,7)!==st.calMonth) st.calMonth=k.slice(0,7); render(); break; }
    case 'cal-step': calStep(+b.dataset.d); break;
    case 'cal-today': st.calMonth=TODAY.slice(0,7); st.calDay=null; render(); break;
    case 'repeat': { const nw=copyWorkout(w,TODAY); workouts.push(nw); st.open=nw.id; render(); scrollTo(0,0); break; }
    case 'del-w': { const x=W(+b.dataset.id); confirmSheet(`${fmt(x.date)} · ${esc(x.title)}`, 'Запись будет стёрта из дневника.', ()=>{workouts=workouts.filter(o=>o!==x)}, 'Стереть запись'); break; }
    case 'yes': pending&&pending(); pending=null; close(); render(); break;
    case 'close': close(); break;
    case 'new': newSheet(b.dataset.d||TODAY); break;
    case 'new-from': {
      const date = document.getElementById('nw-date').value || TODAY;
      const nw = copyWorkout(W(+b.dataset.id), date);
      workouts.push(nw); close(); if(st.screen!=='workout') st.from=st.screen; st.screen='workout'; st.open=nw.id; render(); scrollTo(0,0); break; }
    case 'set': {
      const s = w.ex[ei].sets[si];
      if(longFired){ longFired=false; break; }
      /* v23: двойное касание = шторка правки; первое касание откатывается */
      const tk=`${st.open}-${ei}-${si}`, now=Date.now();
      if(dblT && dblT.k===tk && now-dblT.t<380){ clearTimeout(eraseT); const o=dblT.o; dblT=null;
        if(o===undefined) delete s.done; else s.done=o; st.lastDrawn=null; render(); editSheet(ei,si); break; }
      dblT={k:tk,t:now,o:s.done};
      if(isDone(s)){ /* v22: второй штрих стирается обратной анимацией, потом перерисовка */
        if(b.dataset.erasing) break; const sv=b.querySelector('.x svg:last-child');
        const fin=()=>{ s.done = false; st.lastDrawn=null; render(); };
        if(sv && !matchMedia('(prefers-reduced-motion:reduce)').matches){ b.dataset.erasing=1; sv.classList.remove('draw'); sv.classList.add('erase'); eraseT=setTimeout(fin,260); } else fin();
        break; }
      s.done = true; st.lastDrawn=`${ei}-${si}`; render(); break; }
    case 'set-edit': document.querySelectorAll('.toast').forEach(x=>x.remove()); editSheet(ei,si); break;
    case 'st': { keepNote(); const k=b.dataset.k, d=+b.dataset.d; edit[k]=Math.max(k==='r'?1:0, Math.round((edit[k]+d)*10)/10); edit.confirmDel=false; drawEdit(); break; }
    case 'set-save': { keepNote(); const s=w.ex[edit.ei].sets[edit.si]; s.r=edit.r; s.w=edit.w; s.done=true;
      if(edit.n.trim()) s.n=edit.n.trim(); else delete s.n; close(); render(); break; }
    case 'set-del': if(!edit.confirmDel){keepNote();edit.confirmDel=true;drawEdit();break;} w.ex[edit.ei].sets.splice(edit.si,1); close(); render(); break;

/* ЭТАП 2: ХРАНЕНИЕ НА ТЕЛЕФОНЕ. Всё состояние — одним JSON в localStorage (ключ xset-data), пишется после каждого действия.
   Копия = тот же JSON файлом (Настройки → «Сохранить копию»), загрузка — оттуда же; принимает и data/history.json (массив тренировок). */
const APP_VER = '1.5';
const DB_KEY = 'xset-data';
/* ЭТАП 3 (облако): для слияния телефонов у тренировки есть метка изменения upd, у стёртых — tomb[id]=когда стёрта,
   у настроек (программы, база, архив…) — общая метка setUpd. Метки ставит save() сам, сравнивая с прошлым видом (known). */
let tomb = {}, setUpd = 0, known = new Map(), knownSet = '';
/* id новых записей — по времени, чтобы два телефона не выдали одинаковый */
function nextId(){ return uid = Math.max(uid+1, Date.now()); }
const wKey = w => JSON.stringify(w, (k,v)=>k==='upd'?undefined:v);
const setKey = ()=>JSON.stringify([programs, activeProg, mineLib, cardioLib, CARDIO_STD, STD, CMODE, [...archived], [...hidden]]);
function rebaseKnown(){ known = new Map(workouts.map(w=>[w.id, wKey(w)])); knownSet = setKey(); }
function stampChanges(){
  const now = Date.now(), ids = new Set(); let ch = false;
  workouts.forEach(w=>{ ids.add(w.id); const k = wKey(w); if(known.get(w.id)!==k){ w.upd = now; known.set(w.id, k); delete tomb[w.id]; ch = true; } });
  known.forEach((k,id)=>{ if(!ids.has(id)){ tomb[id] = now; known.delete(id); ch = true; } });
  const s = setKey(); if(s!==knownSet){ setUpd = now; knownSet = s; ch = true; }
  return ch;
}
function snapshot(){
  return {app:'xset', v:1, saved:new Date().toISOString(), uid, workouts, programs, activeProg, mineLib,
    cardioLib, cardioStd:[...CARDIO_STD], std:STD, cmode:CMODE, archived:[...archived], hidden:[...hidden], tomb, setUpd};
}
function applyData(d){
  if(Array.isArray(d)) d = {workouts:d};          /* история без обёртки (data/history.json) */
  if(!d || !Array.isArray(d.workouts)) throw new Error('bad');
  workouts = d.workouts.map(w=>({note:'',cardio:[],ex:[],title:'Тренировка',...w}));
  workouts.forEach(w=>{ if(typeof w.id!=='number') w.id=0; });
  let mx = Math.max(1000, d.uid||0, ...workouts.map(w=>w.id));
  workouts.forEach(w=>{ if(!w.id) w.id=++mx; });
  uid = mx;
  if(d.tomb && typeof d.tomb==='object') for(const k in d.tomb) tomb[k] = Math.max(tomb[k]||0, +d.tomb[k]||0);
  setUpd = Math.max(setUpd, +d.setUpd||0);
  if(d.std){ Object.keys(STD).forEach(k=>delete STD[k]); Object.assign(STD, d.std); STD_ALL.splice(0, STD_ALL.length, ...Object.values(STD).flat()); }
  if(d.cardioStd) CARDIO_STD.splice(0, CARDIO_STD.length, ...d.cardioStd);
  if(d.cmode) Object.assign(CMODE, d.cmode);
  if(Array.isArray(d.programs)){ programs = d.programs; activeProg = d.activeProg ?? null; }
  if(Array.isArray(d.mineLib)) mineLib = d.mineLib;
  /* кардио из записей, которого нет в базе, — в список кардио */
  cardioLib = Array.isArray(d.cardioLib) ? d.cardioLib : [...CARDIO_STD];
  workouts.forEach(w=>w.cardio.forEach(k=>{ if(!cardioLib.includes(k.kind)) cardioLib.push(k.kind); }));
  hidden.clear(); if(Array.isArray(d.hidden)) d.hidden.forEach(n=>hidden.add(n));
  renameAll();
  archived.clear();
  if(Array.isArray(d.archived)) d.archived.forEach(n=>archived.add(n));
  else {   /* голая история: упражнения не из базы, которых не было 45 дней, — в архив (история с ними остаётся) */
    const last = {}, edge = new Date(Date.now()-45*864e5).toISOString().slice(0,10);
    workouts.forEach(w=>{ w.ex.forEach(e=>{ if(!last[e.name]||last[e.name]<w.date) last[e.name]=w.date; });
      w.cardio.forEach(k=>{ if(!last[k.kind]||last[k.kind]<w.date) last[k.kind]=w.date; }); });
    Object.keys(last).forEach(n=>{ if(!STD_ALL.includes(n) && !CARDIO_STD.includes(n) && last[n]<edge) archived.add(n); });
  }
}
/* переименования стандартной базы (по-русски правильно) — применяются и к старым записям */
const RENAME = {'Жим гантелей на грудь':'Жим гантелей от груди','Икры стоя':'Подъём на носки стоя'};
function renameAll(){
  const r = n=>RENAME[n]||n;
  workouts.forEach(w=>w.ex.forEach(e=>{ e.name=r(e.name); }));
  programs.forEach(p=>p.days.forEach(d=>{ d.ex=d.ex.map(r); }));
  Object.keys(STD).forEach(k=>{ STD[k]=STD[k].map(r); }); STD_ALL.splice(0, STD_ALL.length, ...Object.values(STD).flat());
  mineLib = mineLib.map(r).filter(n=>!STD_ALL.includes(n));
}
